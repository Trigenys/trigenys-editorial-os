name: Resync initial backlog items

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/resync-initial-backlog.yml"

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Resync Issues 1 and 4 through AppFactory Project Automation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          for issue_number in 1 4; do
            jq -n               --arg ref "main"               --arg issue_number "$issue_number"               '{ref: $ref, inputs: {issue_number: $issue_number}}' |
              gh api                 --method POST                 "repos/${GITHUB_REPOSITORY}/actions/workflows/project-automation.yml/dispatches"                 --input -
            echo "Dispatched Project Automation for Issue #${issue_number}."
          done
