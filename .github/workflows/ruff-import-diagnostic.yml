name: Ruff import diagnostic

on:
  push:
    branches: [issue-3-domain-ledger]
    paths:
      - ".github/workflows/ruff-import-diagnostic.yml"

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install "ruff==0.16.9"
      - name: Show exact Ruff fix diff
        run: |
          python -m ruff check --fix --diff             backend/src/editorial_os_api/persistence/models/content.py             backend/src/editorial_os_api/persistence/models/workflow.py || true
