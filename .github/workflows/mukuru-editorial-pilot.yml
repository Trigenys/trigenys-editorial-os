name: Mukuru Editorial Pilot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mukuru-editorial-pilot.yml"
      - "scripts/pilot_mukuru.py"
      - "backend/src/editorial_os_api/vertical_packs/builtin.py"
  workflow_dispatch:
    inputs:
      command:
        description: "inspect is read-only; enrich ingests official sources; draft requires Gate A approval"
        type: choice
        required: true
        default: inspect
        options: [inspect, enrich, draft]

permissions:
  contents: read
  id-token: write

concurrency:
  group: mukuru-editorial-pilot
  cancel-in-progress: false

jobs:
  staging-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      EDITORIAL_OS_ENVIRONMENT: staging
      APPFACTORY_URL: https://appfactory-api.lawrynnjennifer.workers.dev
      REPOSITORY: Trigenys/trigenys-editorial-os
      EDITORIAL_PILOT_MODEL: ${{ vars.EDITORIAL_PILOT_MODEL }}
      GEMINI_API_KEY: ${{ secrets.EDITORIAL_PILOT_GEMINI_API_KEY }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install canonical Editorial OS agents
        run: python -m pip install -e ./backend

      - name: Acquire a scoped staging database lease via AppFactory OIDC
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('appfactory-api');
            core.setSecret(token);
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 15000);
            let response;
            try {
              response = await fetch(
                process.env.APPFACTORY_URL + '/infrastructure/database-lease',
                {
                  method: 'POST',
                  headers: {
                    Authorization: 'Bearer ' + token,
                    'Content-Type': 'application/json'
                  },
                  body: JSON.stringify({repository: process.env.REPOSITORY}),
                  signal: controller.signal
                }
              );
            } finally {
              clearTimeout(timeout);
            }

            let payload;
            try {
              payload = await response.json();
            } catch {
              throw new Error('AppFactory database lease returned non-JSON.');
            }
            if (!response.ok || payload.status !== 'READY' ||
                payload.repository !== process.env.REPOSITORY ||
                payload.database !== 'editorial_os_staging' ||
                typeof payload.databaseUrl !== 'string' ||
                !/^postgres(?:ql)?:\/\//.test(payload.databaseUrl)) {
              throw new Error('Scoped AppFactory staging lease is unavailable.');
            }
            core.setSecret(payload.databaseUrl);
            const sqlalchemyUrl = payload.databaseUrl.replace(
              /^postgres(?:ql)?:\/\//, 'postgresql+psycopg://'
            );
            core.setSecret(sqlalchemyUrl);
            core.exportVariable('EDITORIAL_OS_DATABASE_URL', sqlalchemyUrl);

      - name: Gate-respecting Mukuru pilot
        shell: bash
        run: |
          set -euo pipefail
          command_name="${{ github.event_name == 'workflow_dispatch' && inputs.command || 'inspect' }}"
          case "$command_name" in
            inspect|enrich|draft) ;;
            *) echo "Unknown command" >&2; exit 2 ;;
          esac
          python scripts/pilot_mukuru.py "$command_name"

      - name: Report safe operating mode
        if: always()
        run: |
          {
            echo "### Mukuru editorial staging pilot"
            echo
            echo "- Fixed Mukuru workflow run; dedicated Neon staging database."
            echo "- No direct DB password configured; AppFactory OIDC lease."
            echo "- Gate A must be approved in the authenticated Control Room."
            echo "- Gate B and C remain mandatory; this workflow never publishes."
            echo "- AI usage only with a configured provider key and per-run ceiling of $0.50."
          } >> "$GITHUB_STEP_SUMMARY"
