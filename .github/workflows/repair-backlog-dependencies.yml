name: Repair backlog dependency references

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-backlog-dependencies.yml"

permissions:
  contents: read
  issues: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Repair issue dependency headers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          repair_issue() {
            local issue_number="$1"
            local dependency_line="$2"
            local body
            local updated

            body="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${issue_number}" --jq '.body // ""')"

            if [[ "$body" != Depends\ on\ \#undefined* ]]; then
              echo "Issue #${issue_number}: dependency header already valid; no-op."
              return 0
            fi

            updated="$(
              printf '%s\n' "$body" | awk -v dep="$dependency_line" '
                NR == 1 && /^Depends on #undefined/ { print dep; next }
                { print }
              '
            )"

            jq -n --arg body "$updated" '{body: $body}' |
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/${issue_number}" --input - >/dev/null

            echo "Issue #${issue_number}: repaired."
          }

          repair_issue 4  "Depends on #3."
          repair_issue 5  "Depends on #3."
          repair_issue 6  "Depends on #4 and #5."
          repair_issue 7  "Depends on #3, #4 and #6."
          repair_issue 8  "Depends on #7 and #5."
          repair_issue 9  "Depends on #8, #5 and #3."
          repair_issue 10 "Depends on #9 and #5."
          repair_issue 11 "Depends on #10 and #3."
          repair_issue 12 "Depends on #9, #10, #11 and #4."
          repair_issue 13 "Depends on #12 and #4."
          repair_issue 14 "Depends on #13, #6 and #4."
          repair_issue 15 "Depends on #4, #12, #13 and #14."
          repair_issue 16 "Depends on #15."
          repair_issue 17 "Depends on #16."
          repair_issue 18 "Depends on #17, #6, #14 and #13."
