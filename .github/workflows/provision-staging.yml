name: Provision staging infrastructure

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/provision-staging.yml
  workflow_dispatch:
    inputs:
      instance_type:
        description: Staging EC2 size
        required: true
        default: t3.micro
        type: choice
        options:
          - t3.micro
          - t3.small

permissions:
  contents: read
  id-token: write

concurrency:
  group: editorial-os-staging-infra
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-3' }}
  STAGING_STACK_NAME: ${{ vars.STAGING_STACK_NAME || 'trigenys-editorial-os-staging' }}

jobs:
  oidc-probe:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate with proven Trigenys AWS deploy role
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::458018461157:role/atelier-maitre-github-actions-role
          aws-region: eu-west-3
          role-session-name: editorial-os-oidc-probe

      - name: Verify AWS identity and CloudFormation execution role visibility
        run: |
          set -euo pipefail
          aws sts get-caller-identity
          aws iam get-role \
            --role-name atelier-maitre-cloudformation-execution-role \
            --query 'Role.Arn' \
            --output text

  provision:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7

      - name: Validate AWS roles
        env:
          CF_ROLE: ${{ vars.AWS_CLOUDFORMATION_ROLE_ARN }}
          DEPLOY_ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          test -n "$CF_ROLE" || {
            echo "Missing staging variable AWS_CLOUDFORMATION_ROLE_ARN" >&2
            exit 1
          }
          test -n "$DEPLOY_ROLE" || {
            echo "Missing staging variable AWS_DEPLOY_ROLE_ARN" >&2
            exit 1
          }

      - name: Authenticate to AWS with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: editorial-os-staging-infra

      - name: Deploy staging CloudFormation stack
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --stack-name "$STAGING_STACK_NAME" \
            --template-file infra/aws/staging.yml \
            --role-arn "${{ vars.AWS_CLOUDFORMATION_ROLE_ARN }}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides "InstanceType=${{ inputs.instance_type }}"

      - name: Resolve instance id
        id: stack
        run: |
          instance_id="$(
            aws cloudformation describe-stacks \
              --stack-name "$STAGING_STACK_NAME" \
              --query "Stacks[0].Outputs[?OutputKey=='InstanceId'].OutputValue | [0]" \
              --output text
          )"
          test -n "$instance_id" && test "$instance_id" != "None"
          echo "instance_id=$instance_id" >> "$GITHUB_OUTPUT"

      - name: Wait for SSM registration
        env:
          INSTANCE_ID: ${{ steps.stack.outputs.instance_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            status="$(
              aws ssm describe-instance-information \
                --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
                --query 'InstanceInformationList[0].PingStatus' \
                --output text 2>/dev/null || true
            )"
            if [[ "$status" == "Online" ]]; then
              echo "Staging host is online in SSM: $INSTANCE_ID"
              exit 0
            fi
            sleep 10
          done
          echo "Staging host did not become SSM Online in time." >&2
          exit 1
