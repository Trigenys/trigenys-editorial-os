name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  impact:
    uses: EagleFox31/appfactory-project-automation/.github/workflows/reusable-impact-analysis.yml@9e351696d594c99059563f93140b492814f00679
    with:
      appfactory_ref: 9e351696d594c99059563f93140b492814f00679
      config_path: .github/appfactory-impact.json
      mode: ${{ github.event_name == 'workflow_dispatch' && 'all' || 'auto' }}

  web:
    needs: impact
    if: ${{ contains(fromJSON(needs.impact.outputs.gates), 'web') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - run: npm run typecheck
      - run: npm run build

  api:
    needs: impact
    if: ${{ contains(fromJSON(needs.impact.outputs.gates), 'api') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: editorial_os
          POSTGRES_USER: editorial_os
          POSTGRES_PASSWORD: editorial_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U editorial_os -d editorial_os"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      EDITORIAL_OS_ENVIRONMENT: test
      EDITORIAL_OS_DATABASE_URL: postgresql+psycopg://editorial_os:editorial_os@localhost:5432/editorial_os
      EDITORIAL_OS_DATABASE_ECHO: "false"
      LANGGRAPH_STRICT_MSGPACK: "true"

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "./backend[dev]"
      - run: python -m ruff check backend/src backend/tests backend/migrations scripts
      - run: python -m mypy backend/src backend/tests scripts
      - run: python -m pytest backend/tests -q

  staging-artifacts:
    needs: impact
    if: ${{ contains(fromJSON(needs.impact.outputs.gates), 'staging-artifacts') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate staging scripts
        run: bash -n scripts/staging/*.sh
      - name: Validate CloudFormation templates
        run: |
          python -m pip install cfn-lint
          cfn-lint infra/aws/*.yml
      - name: Build staging API image
        run: docker build --file deploy/api.Dockerfile --tag editorial-os-api:ci .
      - name: Build staging web image
        run: |
          docker build \
            --file deploy/web.Dockerfile \
            --build-arg VITE_DEPLOYMENT_LABEL=staging \
            --tag editorial-os-web:ci \
            .
      - name: Validate staging compose
        run: |
          cat > deploy/.env <<'EOF'
          EDITORIAL_OS_ENVIRONMENT=staging
          EDITORIAL_OS_DEPLOYMENT_LABEL=staging
          EDITORIAL_OS_DATABASE_URL=postgresql+psycopg://fixture:fixture@example.invalid/editorial_os
          EDITORIAL_OS_PAYLOAD_ENABLED=true
          EDITORIAL_OS_PAYLOAD_BASE_URL=https://payload.example.invalid
          EDITORIAL_OS_PAYLOAD_API_TOKEN=fixture
          EOF
          API_IMAGE=editorial-os-api:ci \
          WEB_IMAGE=editorial-os-web:ci \
          docker compose --file deploy/compose.staging.yml config >/dev/null
          rm -f deploy/.env


  cloudflare-spike:
    needs: impact
    if: ${{ contains(fromJSON(needs.impact.outputs.gates), 'cloudflare-spike') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
      - name: Build operator console
        run: |
          npm install --ignore-scripts
          npm run build
      - name: Prepare isolated Worker build context
        run: python scripts/cloudflare/prepare_spike.py
      - name: Prove Python Worker bundle without deploying
        working-directory: cloudflare
        run: |
          uv sync --group dev
          uv run pywrangler deploy \
            --dry-run \
            --outdir .wrangler-dist
