name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: Staging action
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - rollback

permissions:
  contents: read
  id-token: write

concurrency:
  group: editorial-os-staging
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-3' }}
  API_REPOSITORY: trigenys/editorial-os-api
  WEB_REPOSITORY: trigenys/editorial-os-web

jobs:
  build:
    if: github.event_name == 'push' || inputs.action == 'deploy'
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      api_image: ${{ steps.images.outputs.api_image }}
      web_image: ${{ steps.images.outputs.web_image }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate staging variables
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          test -n "$AWS_ROLE_ARN" || {
            echo "Missing staging variable AWS_ROLE_ARN" >&2
            exit 1
          }

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure ECR repositories
        run: |
          set -euo pipefail
          for repository in "$API_REPOSITORY" "$WEB_REPOSITORY"; do
            if ! aws ecr describe-repositories               --repository-names "$repository" >/dev/null 2>&1; then
              aws ecr create-repository                 --repository-name "$repository"                 --image-scanning-configuration scanOnPush=true                 --encryption-configuration encryptionType=AES256 >/dev/null
            fi
          done

      - name: Resolve image names
        id: images
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          registry="$account_id.dkr.ecr.$AWS_REGION.amazonaws.com"
          echo "api_image=$registry/$API_REPOSITORY:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "web_image=$registry/$WEB_REPOSITORY:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "registry=$registry" >> "$GITHUB_OUTPUT"

      - name: Log in to ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" |
            docker login               --username AWS               --password-stdin "${{ steps.images.outputs.registry }}"

      - name: Build API image
        run: |
          docker build             --file deploy/api.Dockerfile             --tag "${{ steps.images.outputs.api_image }}"             --tag "${{ steps.images.outputs.registry }}/$API_REPOSITORY:staging-latest"             .

      - name: Build web image
        run: |
          docker build             --file deploy/web.Dockerfile             --build-arg VITE_DEPLOYMENT_LABEL=staging             --tag "${{ steps.images.outputs.web_image }}"             --tag "${{ steps.images.outputs.registry }}/$WEB_REPOSITORY:staging-latest"             .

      - name: Push immutable and staging tags
        run: |
          docker push "${{ steps.images.outputs.api_image }}"
          docker push "${{ steps.images.outputs.web_image }}"
          docker push "${{ steps.images.outputs.registry }}/$API_REPOSITORY:staging-latest"
          docker push "${{ steps.images.outputs.registry }}/$WEB_REPOSITORY:staging-latest"

  deploy:
    if: github.event_name == 'push' || inputs.action == 'deploy'
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Validate staging target
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          INSTANCE_ID: ${{ vars.STAGING_EC2_INSTANCE_ID }}
        run: |
          test -n "$AWS_ROLE_ARN" || {
            echo "Missing staging variable AWS_ROLE_ARN" >&2
            exit 1
          }
          test -n "$INSTANCE_ID" || {
            echo "Missing staging variable STAGING_EC2_INSTANCE_ID" >&2
            exit 1
          }

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy immutable revision through SSM
        env:
          INSTANCE_ID: ${{ vars.STAGING_EC2_INSTANCE_ID }}
          API_IMAGE: ${{ needs.build.outputs.api_image }}
          WEB_IMAGE: ${{ needs.build.outputs.web_image }}
          REPOSITORY_URL: https://github.com/Trigenys/trigenys-editorial-os.git
        run: |
          set -euo pipefail

          jq -n             --arg repository "$REPOSITORY_URL"             --arg sha "$GITHUB_SHA"             --arg region "$AWS_REGION"             --arg api_image "$API_IMAGE"             --arg web_image "$WEB_IMAGE"             '{
              commands: [
                "set -euo pipefail",
                "install -d -m 0755 /opt/trigenys/editorial-os",
                "if [ ! -d /opt/trigenys/editorial-os/repo/.git ]; then git clone " + $repository + " /opt/trigenys/editorial-os/repo; fi",
                "git -C /opt/trigenys/editorial-os/repo fetch --depth=1 origin " + $sha,
                "git -C /opt/trigenys/editorial-os/repo checkout --detach " + $sha,
                "install -d -m 0750 /opt/trigenys/editorial-os/staging",
                "cp /opt/trigenys/editorial-os/repo/deploy/compose.staging.yml /opt/trigenys/editorial-os/staging/compose.staging.yml",
                "cp /opt/trigenys/editorial-os/repo/scripts/staging/refresh_env_from_ssm.sh /opt/trigenys/editorial-os/staging/refresh_env_from_ssm.sh",
                "cp /opt/trigenys/editorial-os/repo/scripts/staging/smoke.sh /opt/trigenys/editorial-os/staging/smoke.sh",
                "cp /opt/trigenys/editorial-os/repo/scripts/staging/deploy.sh /opt/trigenys/editorial-os/staging/deploy.sh",
                "cp /opt/trigenys/editorial-os/repo/scripts/staging/rollback.sh /opt/trigenys/editorial-os/staging/rollback.sh",
                "chmod 0750 /opt/trigenys/editorial-os/staging/*.sh",
                "cd /opt/trigenys/editorial-os/staging",
                "AWS_REGION=" + $region + " ./deploy.sh " + $api_image + " " + $web_image
              ]
            }' > ssm-parameters.json

          command_id="$(
            aws ssm send-command               --instance-ids "$INSTANCE_ID"               --document-name AWS-RunShellScript               --comment "Deploy Editorial OS staging $GITHUB_SHA"               --parameters file://ssm-parameters.json               --query 'Command.CommandId'               --output text
          )"

          if ! aws ssm wait command-executed             --command-id "$command_id"             --instance-id "$INSTANCE_ID"; then
            aws ssm get-command-invocation               --command-id "$command_id"               --instance-id "$INSTANCE_ID"               --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}'
            exit 1
          fi

          aws ssm get-command-invocation             --command-id "$command_id"             --instance-id "$INSTANCE_ID"             --query '{Status:Status,Stdout:StandardOutputContent}'

      - name: External staging smoke test
        if: vars.STAGING_BASE_URL != ''
        env:
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$STAGING_BASE_URL/health/web" >/dev/null
          curl --fail --silent --show-error "$STAGING_BASE_URL/health/api" |
            python -c 'import json,sys; p=json.load(sys.stdin); assert p["environment"]=="staging" and p["deployment"]=="staging"'
          curl --fail --silent --show-error "$STAGING_BASE_URL/health/ready" |
            python -c 'import json,sys; assert json.load(sys.stdin)["status"]=="ready"'

  rollback:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'rollback'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Restore previous staging images
        env:
          INSTANCE_ID: ${{ vars.STAGING_EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          test -n "$INSTANCE_ID" || {
            echo "Missing staging variable STAGING_EC2_INSTANCE_ID" >&2
            exit 1
          }

          parameters='{"commands":["set -euo pipefail","cd /opt/trigenys/editorial-os/staging","AWS_REGION='"$AWS_REGION"' ./rollback.sh"]}'
          command_id="$(
            aws ssm send-command               --instance-ids "$INSTANCE_ID"               --document-name AWS-RunShellScript               --comment "Rollback Editorial OS staging"               --parameters "$parameters"               --query 'Command.CommandId'               --output text
          )"
          aws ssm wait command-executed             --command-id "$command_id"             --instance-id "$INSTANCE_ID"
