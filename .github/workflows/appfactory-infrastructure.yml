name: AppFactory infrastructure

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".appfactory/staging-infrastructure.json"

permissions:
  contents: read
  id-token: write

concurrency:
  group: appfactory-infrastructure-staging
  cancel-in-progress: false

jobs:
  staging:
    runs-on: ubuntu-latest
    env:
      APPFACTORY_URL: https://appfactory-api.lawrynnjennifer.workers.dev
      OIDC_AUDIENCE: appfactory-api
      REPOSITORY: Trigenys/trigenys-editorial-os

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate declarative staging request
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .schemaVersion == 1 and
            .provider == "cloudflare" and
            .environment == "staging" and
            .worker.runtime == "python" and
            .worker.rootDirectory == "/backend" and
            .worker.recipe == "runtime-only" and
            .database.provider == "neon" and
            .database.profile == "trigenys-editorial-os-staging" and
            .database.binding == "HYPERDRIVE" and
            .database.migration == "python-alembic" and
            .costPolicy.requiresPaidCompute == false and
            .costPolicy.awsEc2 == false and
            .costPolicy.cloudflareContainers == false
          ' .appfactory/staging-infrastructure.json >/dev/null

      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --fail             --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          token="$(jq -r '.value // empty' <<<"$response")"
          test -n "$token"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Bootstrap managed staging Worker
        id: worker_bootstrap
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          payload="$(jq -cn             --arg repository "$REPOSITORY"             '{
              repository: $repository,
              environment: "staging",
              rootDirectory: "/backend",
              buildCommand: "bash scripts/package_worker.sh dry-run wrangler.production.toml ../worker-dist-production",
              deployCommand: "bash scripts/package_worker.sh deploy wrangler.production.toml"
            }')"
          response_file="$(mktemp)"
          code="$(curl --silent --show-error             --output "$response_file"             --write-out "%{http_code}"             --request POST             --header "Content-Type: application/json"             --header "Authorization: Bearer $OIDC_TOKEN"             --data "$payload"             "$APPFACTORY_URL/infrastructure/worker")"
          jq . "$response_file"
          [[ "$code" == "200" ]] || {
            echo "::error::AppFactory Worker bootstrap returned HTTP $code"
            exit 1
          }

      - name: Bootstrap staging Neon profile
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          payload="$(jq -cn --arg repository "$REPOSITORY" '{repository: $repository}')"
          response_file="$(mktemp)"
          code="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --request POST \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer $OIDC_TOKEN" \
            --data "$payload" \
            "$APPFACTORY_URL/infrastructure/neon")"
          jq . "$response_file"
          [[ "$code" == "200" ]] || {
            echo "::error::AppFactory Neon bootstrap returned HTTP $code"
            exit 1
          }

      - name: Provision staging Hyperdrive
        id: hyperdrive
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          payload="$(jq -cn             --arg repository "$REPOSITORY"             '{
              repository: $repository,
              environment: "staging"
            }')"
          response_file="$(mktemp)"
          code="$(curl --silent --show-error             --output "$response_file"             --write-out "%{http_code}"             --request POST             --header "Content-Type: application/json"             --header "Authorization: Bearer $OIDC_TOKEN"             --data "$payload"             "$APPFACTORY_URL/infrastructure/hyperdrive")"
          jq . "$response_file"
          [[ "$code" == "200" ]] || {
            echo "::error::AppFactory Hyperdrive provisioning returned HTTP $code"
            exit 1
          }

      - name: Reconcile Worker with Hyperdrive and Alembic gate
        id: worker_release
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          payload="$(jq -cn             --arg repository "$REPOSITORY"             '{
              repository: $repository,
              environment: "staging",
              rootDirectory: "/backend",
              buildCommand: "bash scripts/package_worker.sh dry-run wrangler.production.toml ../worker-dist-production",
              deployCommand: "bash scripts/package_worker.sh deploy wrangler.production.toml",
              migration: {
                recipe: "python-alembic"
              }
            }')"
          response_file="$(mktemp)"
          code="$(curl --silent --show-error             --output "$response_file"             --write-out "%{http_code}"             --request POST             --header "Content-Type: application/json"             --header "Authorization: Bearer $OIDC_TOKEN"             --data "$payload"             "$APPFACTORY_URL/infrastructure/worker")"
          jq . "$response_file"
          [[ "$code" == "200" ]] || {
            echo "::error::AppFactory Worker release returned HTTP $code"
            exit 1
          }

          state="$(jq -r '.infrastructure.release.state // empty' "$response_file")"
          ready="$(jq -r '.infrastructure.release.readiness.state // empty' "$response_file")"
          hyperdrive="$(jq -r '.infrastructure.release.hyperdrive.configured // false' "$response_file")"

          [[ "$state" == "ready" && "$ready" == "ready" && "$hyperdrive" == "true" ]] || {
            echo "::error::Staging release did not reach database-ready state."
            exit 1
          }

      - name: Acceptance summary
        run: |
          {
            echo "### Editorial OS staging"
            echo
            echo "- Cloudflare Worker: managed by AppFactory"
            echo "- Environment: staging"
            echo "- Hyperdrive: configured"
            echo "- Alembic: release-gated"
            echo "- AWS EC2: not used"
          } >> "$GITHUB_STEP_SUMMARY"
