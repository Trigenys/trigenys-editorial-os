AWSTemplateFormatVersion: "2010-09-09"
Description: Trigenys Editorial OS staging host managed through AWS Systems Manager.

Parameters:
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t3.small
    Description: Small x86 staging instance for the pilot.
  UbuntuAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id

Resources:
  StagingVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: trigenys-editorial-os-staging-vpc
        - Key: Project
          Value: trigenys-editorial-os
        - Key: Environment
          Value: staging

  StagingInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: trigenys-editorial-os-staging-igw
        - Key: Project
          Value: trigenys-editorial-os
        - Key: Environment
          Value: staging

  StagingInternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref StagingInternetGateway
      VpcId: !Ref StagingVpc

  StagingPublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref StagingVpc
      CidrBlock: 10.42.1.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: trigenys-editorial-os-staging-public
        - Key: Project
          Value: trigenys-editorial-os
        - Key: Environment
          Value: staging

  StagingRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref StagingVpc
      Tags:
        - Key: Name
          Value: trigenys-editorial-os-staging-public
        - Key: Project
          Value: trigenys-editorial-os
        - Key: Environment
          Value: staging

  StagingDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: StagingInternetGatewayAttachment
    Properties:
      RouteTableId: !Ref StagingRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref StagingInternetGateway

  StagingRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref StagingRouteTable
      SubnetId: !Ref StagingPublicSubnet

  StagingSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Editorial OS staging - no inbound access; use SSM port forwarding.
      VpcId: !Ref StagingVpc
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: trigenys-editorial-os-staging
        - Key: Project
          Value: trigenys-editorial-os
        - Key: Environment
          Value: staging

  StagingInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub trigenys-editorial-os-staging-instance-${AWS::Region}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: ReadEditorialOSStagingParameters
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/trigenys/editorial-os/staging/*
      Tags:
        - Key: Project
          Value: trigenys-editorial-os
        - Key: Environment
          Value: staging

  StagingInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref StagingInstanceRole

  StagingInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref UbuntuAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref StagingInstanceProfile
      NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeleteOnTermination: true
          DeviceIndex: "0"
          GroupSet:
            - !Ref StagingSecurityGroup
          SubnetId: !Ref StagingPublicSubnet
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        InstanceMetadataTags: enabled
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            DeleteOnTermination: true
            Encrypted: true
            VolumeSize: 20
            VolumeType: gp3
      UserData:
        Fn::Base64: |
          #!/usr/bin/env bash
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y docker.io docker-compose-v2 git awscli jq curl
          systemctl enable --now docker
          if command -v snap >/dev/null 2>&1; then
            snap start amazon-ssm-agent || true
          fi
          install -d -m 0755 /opt/trigenys/editorial-os
          docker version
          docker compose version
      Tags:
        - Key: Name
          Value: trigenys-editorial-os-staging
        - Key: Project
          Value: trigenys-editorial-os
        - Key: Environment
          Value: staging

Outputs:
  InstanceId:
    Description: SSM managed staging host.
    Value: !Ref StagingInstance
  PrivateIp:
    Description: Private address for diagnostics.
    Value: !GetAtt StagingInstance.PrivateIp
  PublicIp:
    Description: Ephemeral outbound-only public address; no inbound security-group rules exist.
    Value: !GetAtt StagingInstance.PublicIp
  VpcId:
    Description: Dedicated staging VPC.
    Value: !Ref StagingVpc
