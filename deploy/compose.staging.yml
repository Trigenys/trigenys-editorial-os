name: editorial-os-staging

services:
  migrate:
    image: ${API_IMAGE:?API_IMAGE is required}
    env_file:
      - .env
    command:
      - python
      - -m
      - alembic
      - -c
      - /app/backend/alembic.ini
      - upgrade
      - head
    restart: "no"
    networks:
      - private

  api:
    image: ${API_IMAGE:?API_IMAGE is required}
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    networks:
      - private

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE is required}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${STAGING_WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health/web"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    networks:
      - private

networks:
  private:
    driver: bridge
