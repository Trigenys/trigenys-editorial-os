[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "trigenys-editorial-os-api"
version = "0.1.0"
description = "FastAPI runtime for Trigenys Editorial OS"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.20.0,<1.21.0",
  "fastapi>=0.141.1,<0.142.0",
  "langgraph>=1.2.12,<1.3.0",
  "langgraph-checkpoint-postgres>=3.1.2,<3.2.0",
  "litellm>=1.101.0,<1.102.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic-settings>=2.15.0,<3.0.0",
  "sqlalchemy>=2.0.54,<2.1.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "mypy>=1.17,<2.0",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: requires the configured PostgreSQL database",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
mypy_path = "src"
